name: 15 Coin Onchain Evidence
on:
  push:
    paths:
      - "scan.cjs"
      - "health_check.cjs"
      - "research/test_health_check.cjs"
      - "pool_state.cjs"
      - "spot.cjs"
      - "prep_engine.cjs"
      - "wallet_persistence.cjs"
      - "research/test_wallet_persistence.cjs"
      - "research/test_prep_engine.cjs"
      - "probe_receipts.cjs"
      - ".github/workflows/onchain.yml"
  workflow_dispatch:
  schedule:
    - cron: "11,26,41,56 * * * *"
permissions:
  contents: write
concurrency:
  group: fifteen-coin-onchain-hourly
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Mark start time of THIS collection run
        shell: bash
        run: echo "RADAR_RUN_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Syntax validation
        run: node --check scan.cjs
      - name: Syntax validate pool state module
        run: node --check pool_state.cjs
      - name: Syntax validate spot module
        run: node --check spot.cjs
      - name: Read genuine spot OHLCV and compute RVOL
        run: node spot.cjs
        continue-on-error: true
      - name: Syntax validate BSC receipt probe
        run: node --check probe_receipts.cjs
      - name: Probe BSC block receipt event availability
        run: node probe_receipts.cjs
        continue-on-error: true
      - name: Read public BSC pool state via official RPC
        run: node pool_state.cjs
        continue-on-error: true
      - name: One-time historical market replay (push only)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'Research replay') }}
        run: |
          node --check research/backtest.cjs
          node research/backtest.cjs
      - name: Scan public chain transfer and liquidity events
        run: node scan.cjs
        continue-on-error: true
      - name: Validate dynamic wallet persistence against continuity controls
        run: |
          node --check wallet_persistence.cjs
          node research/test_wallet_persistence.cjs
      - name: Read dynamic EOA balances on BSC official RPC
        run: node wallet_persistence.cjs
      - name: Validate preparation decision rules against positive and negative controls
        run: |
          node --check prep_engine.cjs
          node research/test_prep_engine.cjs
      - name: Classify timestamped fifteen-coin preparation evidence
        run: node prep_engine.cjs
      - name: Verify integrity tests including missed live windows
        run: |
          node --check health_check.cjs
          node research/test_health_check.cjs
      - name: Create auditable health snapshot before persistence
        run: node health_check.cjs
        continue-on-error: true
      # A failed or incomplete scan must never overwrite the last valid evidence snapshot.
      - name: Persist verified radar data without race conditions
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const h=require("./radar_data/health_latest.json");if(h.status!=="LIVE_HEALTHY_WITH_COVERAGE_LIMITS"||h.errors?.length||h.workflowRunId!==process.env.GITHUB_RUN_ID){console.error("Refusing to publish incomplete or mismatched snapshot",h.status,h.errors);process.exit(1)}'
          git config user.name "onchain-radar-bot"
          git config user.email "onchain-radar-bot@users.noreply.github.com"
          SNAPSHOT_DIR="$(mktemp -d)"
          trap 'rm -rf "$SNAPSHOT_DIR"' EXIT
          files=(
            radar_data/spot_latest.json
            radar_data/health_latest.json
            radar_data/spot_history.json
            radar_data/research_backtest_latest.json
            radar_data/prep_latest.json
            radar_data/prep_history.json
            radar_data/wallet_latest.json
            radar_data/wallet_track.json
            radar_data/pool_state_latest.json
            radar_data/pool_state.json
            radar_data/receipt_probe.json
            radar_data/latest.json
            radar_data/state.json
          )
          for file in "${files[@]}"; do
            if test -f "$file"; then
              mkdir -p "$SNAPSHOT_DIR/$(dirname "$file")"
              cp "$file" "$SNAPSHOT_DIR/$file"
            fi
          done
          local_ms="$(node -p 'Date.parse(require("./radar_data/health_latest.json").asOfUtc)')"
          for attempt in 1 2 3 4; do
            if ! git fetch origin main; then
              echo "::warning::Git fetch attempt $attempt failed"
              sleep "$((attempt*2))"
              continue
            fi
            remote_ms="$(git show origin/main:radar_data/health_latest.json 2>/dev/null | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{try{const n=Date.parse(JSON.parse(s).asOfUtc);console.log(Number.isFinite(n)?n:0)}catch{console.log(0)}})')"
            if test "$remote_ms" -ge "$local_ms"; then
              echo "A newer or equal health snapshot already exists; this run is superseded."
              echo "RADAR_PUBLISHED=false" >> "$GITHUB_ENV"
              exit 0
            fi
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- scan.cjs pool_state.cjs spot.cjs wallet_persistence.cjs prep_engine.cjs health_check.cjs probe_receipts.cjs .github/workflows/onchain.yml; then
              echo "::notice::Collector code changed since this run started; do not publish older-code evidence."
              echo "RADAR_PUBLISHED=false" >> "$GITHUB_ENV"
              exit 0
            fi
            git reset --hard origin/main
            for file in "${files[@]}"; do
              if test -f "$SNAPSHOT_DIR/$file"; then
                mkdir -p "$(dirname "$file")"
                cp "$SNAPSHOT_DIR/$file" "$file"
                git add -f -- "$file"
              fi
            done
            if git diff --cached --quiet; then
              echo "RADAR_PUBLISHED=false" >> "$GITHUB_ENV"
              exit 0
            fi
            git commit -m "Radar evidence snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then
              echo "RADAR_PUBLISHED=true" >> "$GITHUB_ENV"
              echo "Published verified run $GITHUB_RUN_ID"
              exit 0
            fi
            echo "::warning::Concurrent repository update; retrying on current main ($attempt/4)"
            sleep "$((attempt*2))"
          done
          echo "::error::Unable to publish verified evidence after four conflict-safe attempts"
          exit 1

      - name: Verify onchain health after data is persisted
        if: ${{ env.RADAR_PUBLISHED == 'true' }}
        run: node health_check.cjs --verify-only
