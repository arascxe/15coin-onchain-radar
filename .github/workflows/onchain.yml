name: 15 Coin Onchain Evidence
on:
  push:
    paths:
      - "scan.cjs"
      - "pool_state.cjs"
      - "spot.cjs"
      - "prep_engine.cjs"
      - "wallet_persistence.cjs"
      - "research/test_wallet_persistence.cjs"
      - "research/test_prep_engine.cjs"
      - "probe_receipts.cjs"
      - ".github/workflows/onchain.yml"
  workflow_dispatch:
  schedule:
    - cron: "8,23,38,53 * * * *"
permissions:
  contents: write
concurrency:
  group: fifteen-coin-onchain-hourly
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax validation
        run: node --check scan.cjs
      - name: Syntax validate pool state module
        run: node --check pool_state.cjs
      - name: Syntax validate spot module
        run: node --check spot.cjs
      - name: Read genuine spot OHLCV and compute RVOL
        run: node spot.cjs
        continue-on-error: true
      - name: Syntax validate BSC receipt probe
        run: node --check probe_receipts.cjs
      - name: Probe BSC block receipt event availability
        run: node probe_receipts.cjs
        continue-on-error: true
      - name: Read public BSC pool state via official RPC
        run: node pool_state.cjs
        continue-on-error: true
      - name: One-time historical market replay (push only)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'Research replay') }}
        run: |
          node --check research/backtest.cjs
          node research/backtest.cjs
      - name: Scan public chain transfer and liquidity events
        run: node scan.cjs
        continue-on-error: true
      - name: Validate dynamic wallet persistence against continuity controls
        run: |
          node --check wallet_persistence.cjs
          node research/test_wallet_persistence.cjs
      - name: Read dynamic EOA balances on BSC official RPC
        run: node wallet_persistence.cjs
      - name: Validate preparation decision rules against positive and negative controls
        run: |
          node --check prep_engine.cjs
          node research/test_prep_engine.cjs
      - name: Classify timestamped fifteen-coin preparation evidence
        run: node prep_engine.cjs
      - name: Persist all radar data in one commit
        run: |
          git config user.name "onchain-radar-bot"
          git config user.email "onchain-radar-bot@users.noreply.github.com"
          for file in \
            radar_data/spot_latest.json \
            radar_data/spot_history.json \
            radar_data/research_backtest_latest.json \
            radar_data/prep_latest.json \
            radar_data/prep_history.json \
            radar_data/wallet_latest.json \
            radar_data/wallet_track.json \
            radar_data/pool_state_latest.json \
            radar_data/pool_state.json \
            radar_data/receipt_probe.json \
            radar_data/latest.json \
            radar_data/state.json; do
            if test -f "$file"; then git add -f -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Radar evidence snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Verify onchain health after data is persisted
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs');
          const file='radar_data/latest.json';
          if(!fs.existsSync(file)){console.error('Missing fresh onchain evidence');process.exit(1)}
          const data=JSON.parse(fs.readFileSync(file,'utf8'));
          const age=Date.now()-Date.parse(data.asOfUtc||'');
          const bsc=data.chains?.find(c=>c.chain==='bsc');
          const base=data.chains?.find(c=>c.chain==='base');

          const spot=JSON.parse(fs.readFileSync('radar_data/spot_latest.json','utf8'));
          const pool=JSON.parse(fs.readFileSync('radar_data/pool_state_latest.json','utf8'));
          const history=JSON.parse(fs.readFileSync('radar_data/spot_history.json','utf8'));
          const prep=JSON.parse(fs.readFileSync('radar_data/prep_latest.json','utf8'));
          const wallet=JSON.parse(fs.readFileSync('radar_data/wallet_latest.json','utf8'));
          const fresh=x=>{const dt=Date.now()-Date.parse(x||'');return dt>=0&&dt<600000};
          const spotOk=fresh(spot.asOfUtc)&&spot.counts?.ohlcvReceived===15;
          const v3Ok=fresh(pool.asOfUtc)&&pool.coins?.filter(c=>c.status==='READ_OK').length===10;
          const infinityOk=pool.infinityOnchain?.filter(c=>c.status==='READ_OK').length===3;
          const holdersOk=pool.holderObservations?.filter(c=>c.status==='READ_OK').length===42;
          const historyOk=fresh(history.runs?.at(-1)?.asOfUtc);
          const prepOk=fresh(prep.asOfUtc)&&prep.coins?.length===15&&prep.counts?.coins===15;
          const walletOk=fresh(wallet.asOfUtc)&&wallet.snapshotBlock>0&&wallet.status==='SNAPSHOT_ATTEMPTED';
          const bscTokensOk=data.coins?.filter(c=>c.chain==='bsc'&&c.coverage==='RECEIPTS_SCANNED').length===14;
          console.log('SPOT:',spotOk,'V3:',v3Ok,'Infinity:',infinityOk,'holders:',holdersOk,'history:',historyOk,'BSC tokens:',bscTokensOk);
          console.log('PREP CLASSIFIER:',prepOk,'P1:',prep.counts?.p1,'P2:',prep.counts?.p2,'P3:',prep.counts?.p3,'newAlerts:',prep.newAlerts?.length);
          console.log('DYNAMIC EOA:',walletOk,'tracked:',wallet.counts?.trackedEOAs,'signals:',wallet.counts?.qualifiedPersistence,'errors:',wallet.counts?.failedRPC);
          console.log('BSC:',bsc?.coverage,bsc?.method,'blocks:',bsc?.blocksScanned,'backlog:',bsc?.backlog);
          console.log('BASE:',base?.coverage,'from:',base?.from,'to:',base?.to,'historical gap:',base?.historicalUnscannedFrom,base?.historicalUnscannedTo);
          if(!(age>=0&&age<600000) || bsc?.coverage!=='SUCCESS' || !bsc?.blocksScanned || base?.coverage!=='SUCCESS' || !spotOk || !v3Ok || !infinityOk || !holdersOk || !historyOk || !prepOk || !walletOk || !bscTokensOk){
            console.error('DATA HEALTH FAILED: green Actions status must not mask missing or partial live onchain coverage');
            process.exit(1)
          }
          JS
