name: 15 Coin Onchain Evidence
on:
  push:
    paths:
      - "scan.cjs"
      - "pool_state.cjs"
      - "spot.cjs"
      - "probe_receipts.cjs"
      - ".github/workflows/onchain.yml"
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
concurrency:
  group: fifteen-coin-onchain-hourly
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax validation
        run: node --check scan.cjs
      - name: Syntax validate pool state module
        run: node --check pool_state.cjs
      - name: Syntax validate spot module
        run: node --check spot.cjs
      - name: Read genuine spot OHLCV and compute RVOL
        run: node spot.cjs
        continue-on-error: true
      - name: Syntax validate BSC receipt probe
        run: node --check probe_receipts.cjs
      - name: Probe BSC block receipt event availability
        run: node probe_receipts.cjs
        continue-on-error: true
      - name: Read public BSC pool state via official RPC
        run: node pool_state.cjs
        continue-on-error: true
      - name: Persist BSC pool state before risky event queries
        run: |
          git config user.name "onchain-radar-bot"
          git config user.email "onchain-radar-bot@users.noreply.github.com"
          git add -f radar_data/pool_state_latest.json radar_data/spot_latest.json radar_data/spot_history.json
          if test -f radar_data/receipt_probe.json; then git add -f radar_data/receipt_probe.json; fi
          if test -f radar_data/pool_state.json; then git add -f radar_data/pool_state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Pool state $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      - name: Scan public chain transfer and liquidity events
        run: node scan.cjs
        continue-on-error: true
      - name: Persist current verified coverage and cursors
        run: |
          git config user.name "onchain-radar-bot"
          git config user.email "onchain-radar-bot@users.noreply.github.com"
          git add -f radar_data/latest.json radar_data/state.json radar_data/pool_state_latest.json radar_data/pool_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Onchain evidence snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
